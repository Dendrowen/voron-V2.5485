[gcode_macro _CHANGE_NOZZLE]

variable_sizes =                (   0.2,    0.4,    0.6,    0.8)       # diameter
variable_purge_speed =          (   240,    440,    440,    440)       # purge speed
variable_pa =                   (   0.129,  0.03,   0.02,   0.01)      # Pressure advance

gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    {% set nozzle = params.D|default(0.4)|float %}
    {% for i in range(sizes|length) %}
        {% if sizes[i] == nozzle %}
            {action_respond_info("%f" % sizes[i])}
            SET_PRESSURE_ADVANCE ADVANCE={pa[i]}
            SET_GCODE_VARIABLE MACRO=BLOBIFIER VARIABLE=purge_spd VALUE={purge_speed[i]}
        {% endif %}
    {% endfor %}

[delayed_gcode SET_NOZZLE]
initial_duration: 1.0
gcode:
    {% set nozzles = printer['gcode_macro _CHANGE_NOZZLE'].sizes %}
    RESPOND TYPE=command MSG="action:prompt_begin Set nozzle diameter"
    RESPOND TYPE=command MSG="action:prompt_text Which nozzle is currently equiped?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for nozzle in nozzles %}
        RESPOND TYPE=command MSG={"'action:prompt_button %.2f|_CHANGE_NOZZLE D=%.2f'" % (nozzle, nozzle)}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"