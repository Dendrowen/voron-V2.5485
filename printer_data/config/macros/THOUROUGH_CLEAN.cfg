[gcode_macro THOUROUGH_CLEAN]
variable_start_temp: 270
variable_end_temp: 100
variable_clean_macro: BLOBIFIER_CLEAN
gcode:
    M109 S{start_temp}
    {clean_macro}
    UPDATE_DELAYED_GCODE ID=_THOUROUGH_CLEAN DURATION=1

[delayed_gcode _THOUROUGH_CLEAN]
gcode:
    {% set v = printer['gcode_macro THOUROUGH_CLEAN'] %}
    M104 S0
    {v.clean_macro}
    {% if printer.extruder.temperature > v.end_temp %}
        UPDATE_DELAYED_GCODE ID=_THOUROUGH_CLEAN DURATION=1
    {% endif %}
