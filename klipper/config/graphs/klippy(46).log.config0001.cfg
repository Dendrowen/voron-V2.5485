	MMU_TEST_FORM_TIP {rawparams}

[gcode_macro _MMU_ACTION_CHANGED]
description = Called when an action has changed
gcode =
	{% set vars = printer['gcode_macro _MMU_STATE_VARS'] %}
	{% set action = params.ACTION|string %}
	{% set old_action = params.OLD_ACTION|string %}

	_MMU_LED_ACTION_CHANGED {rawparams}

	{% if not vars.user_action_changed_extension == "" %}
	{vars.user_action_changed_extension} {rawparams}
	{% endif %}

[gcode_macro _MMU_PRINT_STATE_CHANGED]
description = Called when print state changes
gcode =
	{% set vars = printer['gcode_macro _MMU_STATE_VARS'] %}
	{% set state = params.STATE|string %}
	{% set old_state = params.OLD_STATE|string %}

	_MMU_LED_PRINT_STATE_CHANGED {rawparams}

	{% if not vars.user_print_state_changed_extension == "" %}
	{vars.user_print_state_changed_extension} {rawparams}
	{% endif %}

[gcode_macro _MMU_GATE_MAP_CHANGED]
description = Called when gate map is updated
gcode =
	{% set vars = printer['gcode_macro _MMU_STATE_VARS'] %}
	{% set gate = params.GATE|int %}

	_MMU_LED_GATE_MAP_CHANGED {rawparams}

	{% if not vars.user_gate_map_changed_extension == "" %}
	{vars.user_gate_map_changed_extension} {rawparams}
	{% endif %}

[gcode_macro PAUSE]
rename_existing = BASE_PAUSE
description = Pause the print and park
gcode =
	{% set vars = printer['gcode_macro _MMU_CLIENT_VARS'] %}

	{% if printer.pause_resume.is_paused %}
	RESPOND MSG="Print is already paused"
	{% else %}
	_RETRACT
	_MMU_SAVE_POSITION
	BASE_PAUSE
	_MMU_PARK
	{vars.user_pause_extension|default("")}
	{% endif %}

[gcode_macro RESUME]
rename_existing = BASE_RESUME
description = Resume the print
gcode =
	{% set vars = printer['gcode_macro _MMU_CLIENT_VARS'] %}

	{% if not printer.pause_resume.is_paused %}
	RESPOND MSG="Print is not paused. Resume ignored"
	{% else %}
	_MMU_RESTORE_POSITION
	{vars.user_resume_extension|default("")}
	_RETRACT
	BASE_RESUME
	{% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing = BASE_CANCEL_PRINT
description = Cancel print
gcode =
	{% set vars = printer['gcode_macro _MMU_CLIENT_VARS'] %}

	RESPOND MSG="Print cancelled!"
	_MMU_PARK Z_HOP=10
	_MMU_CLEAR_POSITION
	TURN_OFF_HEATERS
	M107
	{vars.user_cancel_extension|default("")}
	BASE_CANCEL_PRINT

[gcode_macro _RETRACT]
description = Helper to retract filament in pause and cancel
gcode =
	{% set vars = printer['gcode_macro _MMU_CLIENT_VARS'] %}
	{% set length = params.LENGTH|default(vars.retract)|default(1.0)|float %}
	{% set speed = params.SPEED|default(vars.retract_speed)|default(1.0)|float %}

	_UNRETRACT LENGTH=-{length|abs} SPEED={speed}

[gcode_macro _UNRETRACT]
description = Helper to extruder filament in resume to undo retract
gcode =
	{% set vars = printer['gcode_macro _MMU_CLIENT_VARS'] %}
	{% set length = params.LENGTH|default(vars.unretract)|default(1.0)|float %}
	{% set speed = params.SPEED|default(vars.unretract_speed)|default(1.0)|float %}

	{% if printer.extruder.can_extrude %}
	M83
	G1 E{length} F{speed|abs * 60}
	{% endif %}

