[gcode_macro FLOW]


# =======================================================================================
# ============================================= MACRO SETTINGS ==========================
# =======================================================================================
variable_print_start_macro =            "PRINT_START"
variable_print_start_extruder_param =   "EXTRUDER"
variable_print_start_bed_param =        "BED"
variable_print_start_chamber_param =    "CHAMBER"

variable_print_end_macro =              "PRINT_END"

# =======================================================================================
# ============================================= PRINT SETTINGS ==========================
# =======================================================================================
variable_extruder_temp: 235
variable_bed_temp: 100
variable_chamber_temp: 38
variable_retract_speed: 1800
variable_retract_amount: 1
variable_speed_travel: 48000
variable_speed_first_layer: 3000
variable_speed_infill: 18000
variable_speed_bridging: 4000
variable_speed_perimiter: 9000 # and top layer

# =======================================================================================
# ============================================= FLOW TESTS ==============================
# =======================================================================================
variable_spacing: 50, 50
variable_bed_size: 300, 275

gcode:
    {% set extruder_t = params.EXTRUDER_TEMP|default(extruder_temp)|int %}
    {% set bed_t = params.BED_TEMP|default(bed_temp)|int %}
    {% set chamber_t = params.CHAMBER_TEMP|default(chamber_temp)|int %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set flow_start = params.FLOW_START|default(86)|float %}
    {% set flow_incr = params.FLOW_INCR|default(2)|float %}
    {% set flow_end = params.FLOW_END|default(102)|float %}
    

    {% set max_cubes_x = ((bed_size[0] - 30) // (spacing[0] + 30) + 1)|int %}
    {% set max_cubes_y = ((bed_size[1] - 30) // (spacing[1] + 30) + 1)|int %}
    {% set max_cubes = max_cubes_x * max_cubes_y %}
    {% set cubes_xy_ratio = max_cubes_x / max_cubes_y %}
    {% set distance_x = spacing[0] + 30 %}
    {% set distance_y = spacing[1] + 30 %}

    {% set requested_cubes = ((flow_end - flow_start) // flow_incr + 1)|int %}

    {% if requested_cubes > max_cubes %}
        {action_raise_error(
            "Requested more (%s) than the maximum allowed (%s) 
                cubes to fit on your buildplate"
            % (requested_cubes, max_cubes)
        )}
    {% endif %}

    {% if printer.mmu and printer.mmu.filament_position < 9 and tool == -1 %}
      {action_raise_error("No tool selected or loaded")}
    {% endif %}

    {% set cubes = [] %}
    {% for i in range(requested_cubes) %}
        { cubes.append(flow_start + i * flow_incr) or ""}
    {% endfor %}

    {% set cubes_x = (requested_cubes ** 0.5)|round(0, 'ceil')|int %}
    {% set cubes_y = (requested_cubes / cubes_x)|round(0, 'ceil')|int %}

    {% if cubes_x > max_cubes_x or cubes_y > max_cubes_y %}
        {% if cubes_x < cubes_y %}
            {% set cubes_x = max_cubes_x %}
            {% set cubes_y = (requested_cubes / cubes_x)|round(0, 'ceil')|int %}
        {% else %}
            {% set cubes_y = max_cubes_y %}
            {% set cubes_x = (requested_cubes / cubes_y)|round(0, 'ceil')|int %}
        {% endif %}    
    {% endif %}

    {% set center = [bed_size[0]/2, bed_size[1]/2] %}
    

    {% set x_min = (center[0] - distance_x * ((cubes_x - 1) / 2))|int %}
    {% set x_max = (center[0] + distance_x * ((cubes_x - 1) / 2))|int %}
    {% set y_min = (center[1] - distance_y * ((cubes_y - 1) / 2))|int %}
    {% set y_max = (center[1] + distance_y * ((cubes_y - 1) / 2))|int %}

    {% set positions = [] %}
    {% for y in range(y_max, y_min - 1, -distance_y) %}
        {% for x in range(x_min, x_max + 1, distance_x) %}
            {positions.append([x,y]) or ""}
        {% endfor %}
    {% endfor %}

    {% set output = ["Refer to this layout to determine the best flow:"] %}

    # {% for i in range(cubes|count - cubes|count % cubes_x, -1, -cubes_x) %}
    {% for i in range(0, cubes|count, cubes_x) %}
        {% set row_length = [cubes_x, cubes|count - i]|min %}
        {% set row = cubes[i:i+cubes_x]|map('string') %}
        {output.append( '┌────────┐ ⠀⠀' * row_length) or ""}
        {output.append(('│ {:⠀^6s}│ ⠀⠀' * row_length).format(*row)) or ""}
        {output.append( '└────────┘ ⠀⠀' * row_length) or ""}
        {output.append("") or ""}
    {% endfor %}

    {action_respond_info("STARTING FLOW TEST:")}
    {action_respond_info(output|join('\n'))}

    {print_start_macro} {print_start_extruder_param}={extruder_t} {print_start_bed_param}={bed_t} {print_start_chamber_param}={chamber_t}

    {% if tool >= 0 %}
      T{tool}
    {% elif printer['gcode_macro BLOBIFIER'] %}
      BLOBIFIER PURGE_LENGTH=50
    {% endif %}
    {% for i in range(cubes|count) %}
        {% set cube = cubes[i] %}
        {% set pos = positions[i] %}
        G1 E-{retract_amount} Z3.4 F{retract_speed}
        _CUBE FLOW={cube} X={pos[0]} Y={pos[1]}
        M400
    {% endfor %}
    {action_respond_info("FLOW TEST FINISHED")}
    {action_respond_info(output|join('\n'))}

    {print_end_macro}

