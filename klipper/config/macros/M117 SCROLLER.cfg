[gcode_macro M117]
rename_existing: M117.1
variable_msg: ""
variable_scroll: 0
gcode:
  {% if rawparams %}
    {% set message = (rawparams.split(';', 1)[0].split('\x23', 1)[0]|replace('"', '\\"')) %}
    {% if not (message[:1] == "T" and message|length == 2) %}
      SET_GCODE_VARIABLE MACRO=M117 VARIABLE=msg VALUE='"{message}"'
    {% endif %}
  {% endif %}
  SCROLL_M117
  UPDATE_DELAYED_GCODE ID=TIMER_M117 DURATION=1

[delayed_gcode TIMER_M117]
initial_duration: 0.0
gcode:
  SCROLL_M117

[gcode_macro SCROLL_M117]
gcode:
  {% set msg = printer['gcode_macro M117'].msg %}
  {% set scroll = printer['gcode_macro M117'].scroll %}
  {% set tool = printer.mmu.tool %}
  {% set blobs = printer['gcode_macro BLOBIFIER_COUNT'].current_blobs %}
  {% set max_blobs = printer['gcode_macro BLOBIFIER'].max_blobs %}
  {% set remaining_blobs = max_blobs - blobs %}

  {% set status = "T%s[%d]" % (tool if tool >= 0 else "?", remaining_blobs) %}
  {% set a_len = 16 - (status|length) %}
  {% set m_len = (msg|length) %}
  {% set m_scr = m_len - a_len + 3 %}
  {% set c_scr = scroll + 1 %}
  {% set s_msg = ('{:^' + a_len|string + 's}').format(msg) if m_len <= a_len else (msg + " - " + msg)[c_scr:][:a_len] %}

  SET_GCODE_VARIABLE MACRO=M117 VARIABLE=scroll VALUE={c_scr % ((msg|length) + 3)}

  SET_DISPLAY_TEXT MSG="{"%s%s" % (status, s_msg)}"
  UPDATE_DELAYED_GCODE ID=TIMER_M117 DURATION=1
  