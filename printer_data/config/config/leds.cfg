[neopixel sb_leds]
pin: sb2040:gpio12
#   The pin connected to the neopixel. This parameter must be provided.
chain_count: 10
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRB, GRBW,  GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.#

[neopixel chamber_leds]
pin: PB0
chain_count: 39
color_order: RGB
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0

[gcode_macro CHAMBER_LEDS_ON]
gcode:
    SET_LED LED="chamber_leds" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1

[gcode_macro CHAMBER_LEDS_OFF]
variable_iterations: 3
gcode:
    SET_GCODE_VARIABLE MACRO=CHAMBER_LEDS_OFF VARIABLE=iterations VALUE=3
    UPDATE_DELAYED_GCODE ID=CHAMBER_LEDS_OFF DURATION=0.1

[delayed_gcode CHAMBER_LEDS_OFF]
gcode:
    SET_LED LED="chamber_leds" RED=0.01 GREEN=0.01 BLUE=0.01 SYNC=0 TRANSMIT=1
    SET_LED LED="chamber_leds" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
    {% set iterations = printer['gcode_macro CHAMBER_LEDS_OFF'].iterations %}
    {% if iterations > 0 %}
        SET_GCODE_VARIABLE MACRO=CHAMBER_LEDS_OFF VARIABLE=iterations VALUE={iterations - 1}
        UPDATE_DELAYED_GCODE ID=CHAMBER_LEDS_OFF DURATION=0.1
    {% endif %}
