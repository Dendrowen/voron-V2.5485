	{% set vars = printer['gcode_macro _MMU_SEQUENCE_VARS'] %}

	SAVE_GCODE_STATE NAME=MMU_PRE_LOAD_state



	_MMU_AUTO_HOME
	_MMU_SAVE_POSITION
	_MMU_PARK

	{vars.user_pre_load_extension|default("")}

