[gcode_macro TEMPERATURE_265]
gcode:
  {% set bed_temp = params.BED|default(100)|float %}
  {% set hotend_temp = params.HOTEND|default(240)|float %}
  {% set chamber_temp = params.CHAMBER|default(35)|float %}
  PRINT_START EXTRUDER={hotend_temp} BED={bed_temp} CHAMBER={chamber_temp}
  TUNING_TOWER COMMAND="SET_HEATER_TEMPERATURE HEATER=extruder" PARAMETER=TARGET START=265 STEP_DELTA=-5 STEP_HEIGHT=10 SKIP=1.4
  SDCARD_PRINT_FILE FILENAME=tuning/TemperatureTower_220_265.gcode