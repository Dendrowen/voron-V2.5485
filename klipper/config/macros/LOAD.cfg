[gcode_macro LOAD_FILAMENT]
gcode:
   M104 S{params.EXTRUDE_TEMP|default(240)}
   M83                   
   G1 E5 F300
   M109 S{params.EXTRUDE_TEMP|default(240)}
   _LOAD
   _PURGE
   M104 S0

[gcode_macro _LOAD]
gcode:
   M83
   G1 E56 F300                    ; load
   M82                            ; set extruder to absolute

[gcode_macro _PURGE]
gcode:
   M83 
   G1 E60 F150                    ; prime nozzle with filament
   M82                            ; set extruder to absolute
    
[gcode_macro UNLOAD]
gcode:
   M109 S220
   _REMOVE
   M104 S0

[gcode_macro _REMOVE]
gcode:
   M83                            ; set extruder to relative
   G1 E-10 F300                   ; retract some, but not too much or it will jam
   M109 S150
   G1 E11 F300                   ; retract some, but not too much or it will jam
   G1 E-150 F300                    ; retract more, but slowly to give the filament time to harden
   M82                            ; set extruder to absolute