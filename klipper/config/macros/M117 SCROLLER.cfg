[gcode_macro M117]
rename_existing: M117.1
variable_msg: ""
variable_scroll: 0
gcode:
  {% if rawparams %}
    {% set message = (rawparams.split(';', 1)[0].split('\x23', 1)[0]|replace('"', '\\"')) %}
    SET_GCODE_VARIABLE MACRO=M117 VARIABLE=msg VALUE='"{message}"'
  {% endif %}
  UPDATE_DELAYED_GCODE ID=M117_SCROLL DURATION=0.1

[delayed_gcode M117_SCROLL]
gcode:
  {% set msg = printer['gcode_macro M117'].msg %}
  {% set scroll = printer['gcode_macro M117'].scroll %}
  {% set tool = printer.mmu.last_tool %}
  {% set blobs = printer['gcode_macro BLOBIFIER_COUNT'].current_blobs %}
  {% set max_blobs = printer['gcode_macro BLOBIFIER_COUNT'].max_blobs %}
  {% set remaining_blobs = max_blobs - blobs %}

  {% set status = "T%d-%d-" % (tool, remaining_blobs) %}
  {% set a_len = 16 - (status|length) %}
  {% set m_len = (msg|length) %}
  {% set m_scr = m_len - a_len + 3 %}
  {% set c_scr = (scroll + 1) % m_scr %}
  {% set s_msg = msg[c_scr:] %}

  SET_GCODE_VARIABLE MACRO=M117 VARIABLE=scroll VALUE={c_scr}

  SET_DISPLAY_TEXT MSG="{"%s%s" % (status, s_msg)}"
  UPDATE_DELAYED_GCODE ID=M117_SCROLL DURATION=1

  
  
  
  