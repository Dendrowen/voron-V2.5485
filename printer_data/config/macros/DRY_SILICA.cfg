[gcode_macro DRY_SILICA]
variable_no_drop_for_x_minutes: 5
variable_force_g_start: 0
variable_force_g_last: 0
variable_no_drop_measurements: 0
gcode:
    STOP_DRYER
    UPDATE_DELAYED_GCODE ID=TURN_OFF_BED_COOLER DURATION=0
    SET_HEATER_TEMPERATURE HEATER=Chamber TARGET=0
    
    RESPOND MSG="Heat up to 110c"
    M190 S110
    RESPOND MSG="Wait a minute for bed to stabalize"
    G4 P60000
    SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_start VALUE={printer.load_cell.force_g}
    SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_last VALUE={printer.load_cell.force_g}
    RESPOND MSG={"Starting with %dg" % printer.load_cell.force_g}
    UPDATE_DELAYED_GCODE ID=DRY_SILICA DURATION=60

[delayed_gcode DRY_SILICA]
gcode:
    {% set dry = printer['gcode_macro DRY_SILICA'] %}
    {% set force_g = printer.load_cell.force_g %}
    RESPOND MSG={"Force: %dg" % force_g}
    {% if force_g < dry.force_g_last %}
        SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_last VALUE={printer.load_cell.force_g}
    {% else %}
        RESPOND MSG={"No drop: %d/%d" % (dry.no_drop_measurements + 1, dry.no_drop_for_x_minutes)}
        SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=no_drop_measurements VALUE={dry.no_drop_measurements + 1}
    {% endif %}
    {% if dry.no_drop_measurements < dry.variable_no_drop_for_x_minutes %}
        UPDATE_DELAYED_GCODE ID=DRY_SILICA DURATION=60
    {% endif %}
