#  Print Cooling Fan
[fan]
pin: sb2040:gpio13
kick_start_time: 0.5
off_below: 0.10


#  Hotend Fan
[heater_fan hotend_fan]
pin: sb2040:gpio14
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

# toolhead mcu fan
[temperature_fan fan_toolhead]
sensor_type: chamber
sensor_type: temperature_mcu
sensor_mcu: sb2040
pin: sb2040:gpio15
max_temp: 80
target_temp: 45
min_temp: 0
max_speed: 0.7
min_speed: 0.0
kick_start_time: 0.5
off_below: 0.2
control: pid
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5

[temperature_sensor chamber]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF4
min_temp: 0
max_temp: 100

# [controller_fan fan_toolhead]
# pin: sb2040:gpio15
# shutdown_speed: 0.0
# off_below: 0.2
# fan_speed: 0.7
# idle_timeout: 3
# stepper: extruder

# electronics bay fan
[temperature_fan fan_electronics]
sensor_type: temperature_host
pin: PD15
max_temp: 80
target_temp: 59
min_temp: 0
max_speed: 0.4
min_speed: 0.0
kick_start_time: 0.2
off_below: 0.1
control: pid
pid_Kp: 1.0
pid_Ki: 5.0
pid_Kd: 0.5
pid_deriv_time: 20.0

[output_pin nevermore]
pin: PD14
pwm: True
value: 0
shutdown_value: 0

