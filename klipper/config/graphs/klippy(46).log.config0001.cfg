[gcode_macro update_git]
gcode =
	RUN_SHELL_COMMAND CMD=update_git_script

[gcode_shell_command update_git_script]
command = bash /home/pi/klipper-backup/script.sh
timeout = 90.0
verbose = True

[gcode_macro LCDRGB]
gcode =
	{% set knob = params.KNOB|default("22DD22") %}
	{% set knobR = knob[:2]|int(base=16)|float / 255 %}
	{% set knobG = knob[2:4]|int(base=16)|float / 255 %}
	{% set knobB = knob[4:]|int(base=16)|float / 255 %}

	{% set screen = params.SCREEN|default("22DD22") %}
	{% set screenR = screen[:2]|int(base=16)|float / 255 %}
	{% set screenG = screen[2:4]|int(base=16)|float / 255 %}
	{% set screenB = screen[4:]|int(base=16)|float /255 %}

	SET_LED LED=btt_mini12864 RED={screenR} GREEN={screenG} BLUE={screenB} INDEX=1 TRANSMIT=0
	SET_LED LED=btt_mini12864 RED={knobR} GREEN={knobG} BLUE={knobB} INDEX=2 TRANSMIT=0
	SET_LED LED=btt_mini12864 RED={knobR} GREEN={knobG} BLUE={knobB} INDEX=3

[gcode_macro LCD_ON]
gcode =
	LCDRGB

[gcode_macro LCD_OFF]
gcode =
	LCDRGB KNOB=000000 SCREEN=000000

[gcode_macro M109]
rename_existing = M99109
gcode =

	{% set s = params.S|float %}

	M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
	{% if s != 0 %}
	TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+3}
	{% endif %}

[gcode_macro M117]
rename_existing = M117.1
variable_msg = ""
variable_scroll = 0
gcode =
	{% if rawparams %}
	{% set message = (rawparams.split(';', 1)[0].split('\x23', 1)[0]|replace('"', '\\"')) %}
	{% if not (message[:1] == "T" and message|length == 2) %}
	SET_GCODE_VARIABLE MACRO=M117 VARIABLE=msg VALUE='"{message}"'
	{% endif %}
	{% endif %}
	SCROLL_M117
	UPDATE_DELAYED_GCODE ID=TIMER_M117 DURATION=1

[delayed_gcode TIMER_M117]
initial_duration = 0.0
gcode =
	SCROLL_M117

[gcode_macro SCROLL_M117]
gcode =
	{% set msg = printer['gcode_macro M117'].msg %}
	{% set scroll = printer['gcode_macro M117'].scroll %}
	{% set tool = printer.mmu.tool %}
	{% set blobs = printer['gcode_macro _BLOBIFIER_COUNT'].current_blobs %}
	{% set max_blobs = printer['gcode_macro BLOBIFIER'].max_blobs %}
	{% set remaining_blobs = max_blobs - blobs %}

	{% set status = "T%s[%d]" % (tool if tool >= 0 else "?", remaining_blobs) %}
	{% set a_len = 16 - (status|length) %}
	{% set m_len = (msg|length) %}
	{% set m_scr = m_len - a_len + 3 %}
	{% set c_scr = scroll + 1 %}
	{% set s_msg = ('{:^' + a_len|string + 's}').format(msg) if m_len <= a_len else (msg + " - " + msg)[c_scr:][:a_len] %}

	SET_GCODE_VARIABLE MACRO=M117 VARIABLE=scroll VALUE={c_scr % ((msg|length) + 3)}

	SET_DISPLAY_TEXT MSG="{"%s%s" % (status, s_msg)}"
	UPDATE_DELAYED_GCODE ID=TIMER_M117 DURATION=1

[gcode_macro TURN_OFF_MOTORS]
gcode =
	M84

[gcode_macro PARK]
gcode =
	{% set th = printer.toolhead %}
	G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30

[gcode_macro _PARK]
variable_initial_park_z = 9999
variable_travel_speed = 10000
variable_lift_speed = 2000
variable_z_hop = 2
description = Park toolhead safely away from print
gcode =
	{% set park_z_hop = params.Z_HOP|default(z_hop)|float %}
	{% set x = 20 %}
	{% set y = printer.configfile.config["stepper_y"]["position_max"]|float %}
	{% set pos = printer.gcode_move.gcode_position %}
	{% set origin = printer.gcode_move.homing_origin %}
	{% set max = printer.toolhead.axis_maximum %}
	{% set z = [[pos.z, initial_park_z]|min + park_z_hop, max.z - origin.z]|min %}

	{% if not 'xy' in printer.toolhead.homed_axes %}
	RESPOND MSG="Cannot park because XY not homed"
	{% else %}
	G90
	{% if park_z_hop > 0 %}
	{% if not 'z' in printer.toolhead.homed_axes %}
	RESPOND MSG="Skipping z_hop because Z not homed"
	{% else %}
	{% if initial_park_z >= 9999 %}
	SET_GCODE_VARIABLE MACRO=_MMU_Variables VARIABLE=initial_park_z VALUE={pos.z}
	{% endif %}
	G1 Z{z} F{lift_speed}
	{% endif %}
	{% endif %}
	G1 X{x} Y{y} F{travel_speed}
	{% endif %}

[gcode_macro PRINT_END]
gcode =

	{% set pos = printer.gcode_move.gcode_position %}
	{% set origin = printer.gcode_move.homing_origin %}
	{% set max = printer.toolhead.axis_maximum %}

	{% set y = max.y - origin.y %}
	{% set z_hop = [pos.z + 1, max.z - origin.z - 2]|min %}

	SAVE_GCODE_STATE NAME=STATE_PRINT_END

	TURN_OFF_HEATERS
	SET_PIN PIN=nevermore VALUE=0

	G90
	G0 Z{z_hop} E-1 F4000
	G0 Y{y} Z{max.z} F20000
	M107

	CHAMBER_LEDS_OFF
	BED_MESH_CLEAR
	STATUS_COOLING

	SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=electronics TARGET={printer.configfile.settings['temperature_fan electronics'].target_temp}
	RESTORE_GCODE_STATE NAME=STATE_PRINT_END

[gcode_macro SLEEP]
variable_extruder_temp = 0
gcode =
	{% set pos = printer.gcode_move.gcode_position %}
	{% set max_pos = printer.toolhead.axis_maximum %}
	{% set z = [pos.z + 5, max_pos.z]|min %}

	G1 X{max_pos.x/2} Y{max_pos.y}
	G1 Z{z}
	SET_IDLE_TIMEOUT TIMEOUT=84600
	UPDATE_DELAYED_GCODE ID=PAUSE_SLEEPMODE DURATION=300
	SET_GCODE_VARIABLE MACRO=SLEEP VARIABLE=extruder_temp VALUE={printer.extruder.target}

[delayed_gcode PAUSE_SLEEPMODE]
gcode =
	M107
	M104 S0
	{% set pos = printer.gcode_move.gcode_position %}
	{% set max_pos = printer.toolhead.axis_maximum %}
	{% set min_height = 250 %}
	{% set z = [min_height, pos.z]|max %}
	G1 Z{z} F1000
	CHAMBER_LEDS_OFF
	SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=electronics TARGET=68

[gcode_macro WAKE]
gcode =
	UPDATE_DELAYED_GCODE ID=PAUSE_SLEEPMODE DURATION=0
	SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=electronics TARGET=55
	CHAMBER_LEDS_ON
	SET_IDLE_TIMEOUT TIMEOUT=300
	{% set sleep = printer['gcode_macro SLEEP'] %}
	M109 S{sleep.extruder_temp}
	G4 P1000
	M109 S{sleep.extruder_temp}
	BLOBIFIER

[gcode_macro PRINT_START]
gcode =
	STOP_DRYER
	CLEAR_PAUSE

	{% set target_bed = params.BED|int %}
	{% set target_extruder = params.EXTRUDER|int %}
	{% set target_chamber = params.CHAMBER|default("40")|int %}
	{% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
	{% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
	{% set tool = printer.mmu.slicer_tool_map.initial_tool|default(-1)|int %}

	SET_LED LED="chamber_leds" RED=0.6 GREEN=0.8 BLUE=1 SYNC=0 TRANSMIT=1


	SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=electronics TARGET=55


	STATUS_HOMING
	_CG28
	G90


	BED_MESH_CLEAR

	M117 Bed: {target_bed}c
	STATUS_HEATING


	{% if params.BED|int > 90 %}
	M106 S255

	SET_PIN PIN=nevermore VALUE=1

	G1 X{x_wait} Y{y_wait} Z100 F9000
	M190 S{target_bed}
	M117 Heatsoak: {target_chamber}c
	TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}
	SET_PIN PIN=nevermore VALUE=0.5


	{% else %}
	G1 X{x_wait} Y{y_wait} Z15 F9000
	M190 S{target_bed}
	M117 Soak for 3min
	G4 P180000
	{% endif %}


	M117 Hotend: 150c
	M109 S150

	STATUS_CLEANING
	BLOBIFIER_CLEAN


	STATUS_LEVELING
	M117 : :
	_CQGL


	STATUS_MESHING
	M117 :::::
	BED_MESH_CALIBRATE ADAPTIVE=1


	M117 Hotend: {target_extruder}c
	STATUS_HEATING
	M140 S{target_bed}
	{% if printer.mmu.enabled and tool >= 0 %}
	M104 S{target_extruder}
	MMU_CHANGE_TOOL STANDALONE=1 TOOL={tool}
	{% else %}
	M109 S{target_extruder}
	{% endif %}

	M107

	M117 ______v
	STATUS_PRINTING

	G92 E0
	G90

[gcode_macro SEARCH_VARS]
gcode =
	{% if not params.S %}
	{action_respond_info("hmm.. try 'SEARCH_VARS s=\"profile\"'")}
	{% else %}
	{% set resultcount = namespace(total=0) %}
	{% set search = params.S|lower %}
	{% set ns = namespace() %}
	{% for item in printer  %}
	{% if ' ' in item %}
	{% set ns.path = ['printer', "['%s']" % (item), ''] %}
	{% else %}
	{% set ns.path = ['printer.', item, ''] %}
	{% endif %}

	{% if search in ns.path|lower %}
	{ action_respond_info(ns.path|join) }
	{% set resultcount.total = 1 + resultcount.total %}
	{% endif %}

	{% if printer[item].items() %}
	{% for childkey, child in printer[item].items() recursive %}
	{% set ns.path = ns.path[:loop.depth|int + 1] %}

	{% if ' ' in childkey %}
	{% set null = ns.path.append("['%s']" % (childkey)) %}
	{% else %}
	{% set null = ns.path.append(".%s" % (childkey)) %}
	{% endif %}

	{% if child is mapping  %}
	{ loop(child.items()) }
	{% else %}
	{% if search in ns.path|lower %}
	{ action_respond_info("%s : %s" % (ns.path|join, child)) }
	{% set resultcount.total = 1 + resultcount.total %}
	{% endif %}
	{% endif %}

	{% endfor %}
	{% endif %}
	{% endfor %}
	{% if resultcount.total >= 1 %}
	{action_respond_info("found \"" + params.S + "\" " + resultcount.total|string +" times.")}
	{% else %}
	{action_respond_info("\"" + params.S + "\" not found.")}
	{% endif %}
	{% set resultcount.total = 0|int %}
	{% endif %}

[gcode_macro TEMPERATURE_265]
gcode =
	{% set bed_temp = params.BED|default(100)|float %}
	{% set hotend_temp = params.HOTEND|default(240)|float %}
	{% set chamber_temp = params.CHAMBER|default(35)|float %}
	PRINT_START EXTRUDER={hotend_temp} BED={bed_temp} CHAMBER={chamber_temp}
	TUNING_TOWER COMMAND="SET_HEATER_TEMPERATURE HEATER=extruder" PARAMETER=TARGET START=265 STEP_DELTA=-5 STEP_HEIGHT=10 SKIP=1.4
	SDCARD_PRINT_FILE FILENAME=tuning/TemperatureTower_220_265.gcode

[gcode_macro TEST_SPEED]
gcode =

	{% set speed  = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}

	{% set iterations = params.ITERATIONS|default(5)|int %}

	{% set accel  = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}

	{% set bound = params.BOUND|default(20)|int %}

	{% set smallpatternsize = SMALLPATTERNSIZE|default(20)|int %}



	{% set x_min = printer.toolhead.axis_minimum.x + bound %}
	{% set x_max = printer.toolhead.axis_maximum.x - bound %}
	{% set y_min = printer.toolhead.axis_minimum.y + bound %}
	{% set y_max = printer.toolhead.axis_maximum.y - bound %}



	{% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float ) / 2 %}
	{% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float ) / 2 %}


	{% set x_center_min = x_center - (smallpatternsize/2) %}
	{% set x_center_max = x_center + (smallpatternsize/2) %}
	{% set y_center_min = y_center - (smallpatternsize/2) %}
	{% set y_center_max = y_center + (smallpatternsize/2) %}


	SAVE_GCODE_STATE NAME=TEST_SPEED


	{ action_respond_info("TEST_SPEED: starting %d iterations at speed %d, accel %d" % (iterations, speed, accel)) }


	M400
	G28

	{% if printer.configfile.settings.quad_gantry_level %}
	{% if printer.quad_gantry_level.applied == False %}
	QUAD_GANTRY_LEVEL
	G28 Z
	{% endif %}
	{% endif %}

	G90
	G1 X{printer.toolhead.axis_maximum.x-50} Y{printer.toolhead.axis_maximum.y-50} F{30*60}
	M400
	G28 X Y
	G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
	G4 P1000
	GET_POSITION


	G0 X{x_min} Y{y_min} Z{bound + 10} F{speed*60}


	SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}

	{% for i in range(iterations) %}

	G0 X{x_min} Y{y_min} F{speed*60}
	G0 X{x_max} Y{y_max} F{speed*60}
	G0 X{x_min} Y{y_min} F{speed*60}
	G0 X{x_max} Y{y_min} F{speed*60}
	G0 X{x_min} Y{y_max} F{speed*60}
	G0 X{x_max} Y{y_min} F{speed*60}


	G0 X{x_min} Y{y_min} F{speed*60}
	G0 X{x_min} Y{y_max} F{speed*60}
	G0 X{x_max} Y{y_max} F{speed*60}
	G0 X{x_max} Y{y_min} F{speed*60}


	G0 X{x_center_min} Y{y_center_min} F{speed*60}
	G0 X{x_center_max} Y{y_center_max} F{speed*60}
	G0 X{x_center_min} Y{y_center_min} F{speed*60}
	G0 X{x_center_max} Y{y_center_min} F{speed*60}
	G0 X{x_center_min} Y{y_center_max} F{speed*60}
	G0 X{x_center_max} Y{y_center_min} F{speed*60}


	G0 X{x_center_min} Y{y_center_min} F{speed*60}
	G0 X{x_center_min} Y{y_center_max} F{speed*60}
	G0 X{x_center_max} Y{y_center_max} F{speed*60}
	G0 X{x_center_max} Y{y_center_min} F{speed*60}
	{% endfor %}


	SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}


	M400
	G28

	G90
	G0 X{printer.toolhead.axis_maximum.x-1} Y{printer.toolhead.axis_maximum.y-1} F{30*60}
	G4 P1000
	GET_POSITION


	RESTORE_GCODE_STATE NAME=TEST_SPEED

[gcode_macro _CG28]
gcode =
	{% if "xyz" not in printer.toolhead.homed_axes %}
	G28
	{% endif %}

[gcode_macro _CQGL]
gcode =
	{% if printer.quad_gantry_level.applied == False %}
	_CG28
	M109 S150
	QUAD_GANTRY_LEVEL
	G28 Z
	{% endif %}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing = _BED_MESH_CALIBRATE
gcode =

	{% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
	{% set bed_mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}
	{% set bed_mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}
	{% set probe_count = printer.configfile.settings.bed_mesh.probe_count %}
	{% set kamp_settings = printer["gcode_macro _KAMP_Settings"] %}
	{% set verbose_enable = kamp_settings.verbose_enable | abs %}
	{% set probe_dock_enable = kamp_settings.probe_dock_enable | abs %}
	{% set attach_macro = kamp_settings.attach_macro | string %}
	{% set detach_macro = kamp_settings.detach_macro | string %}
	{% set mesh_margin = kamp_settings.mesh_margin | float %}
	{% set fuzz_amount = kamp_settings.fuzz_amount | float %}
	{% set probe_count = probe_count if probe_count|length > 1 else probe_count * 2  %}
	{% set max_probe_point_distance_x = ( bed_mesh_max[0] - bed_mesh_min[0] ) / (probe_count[0] - 1)  %}
	{% set max_probe_point_distance_y = ( bed_mesh_max[1] - bed_mesh_min[1] ) / (probe_count[1] - 1)  %}
	{% set x_min = all_points | map(attribute=0) | min | default(bed_mesh_min[0]) %}
	{% set y_min = all_points | map(attribute=1) | min | default(bed_mesh_min[1]) %}
	{% set x_max = all_points | map(attribute=0) | max | default(bed_mesh_max[0]) %}
	{% set y_max = all_points | map(attribute=1) | max | default(bed_mesh_max[1]) %}

	{% set fuzz_range = range((0) | int, (fuzz_amount * 100) | int + 1) %}
	{% set adapted_x_min = x_min - mesh_margin - (fuzz_range | random / 100.0) %}
	{% set adapted_y_min = y_min - mesh_margin - (fuzz_range | random / 100.0) %}
	{% set adapted_x_max = x_max + mesh_margin + (fuzz_range | random / 100.0) %}
	{% set adapted_y_max = y_max + mesh_margin + (fuzz_range | random / 100.0) %}

	{% set adapted_x_min = [adapted_x_min , bed_mesh_min[0]] | max %}
	{% set adapted_y_min = [adapted_y_min , bed_mesh_min[1]] | max %}
	{% set adapted_x_max = [adapted_x_max , bed_mesh_max[0]] | min %}
	{% set adapted_y_max = [adapted_y_max , bed_mesh_max[1]] | min %}

	{% set points_x = (((adapted_x_max - adapted_x_min) / max_probe_point_distance_x) | round(method='ceil') | int) + 1 %}
	{% set points_y = (((adapted_y_max - adapted_y_min) / max_probe_point_distance_y) | round(method='ceil') | int) + 1 %}

	{% if (([points_x, points_y]|max) > 6) %}
	{% set algorithm = "bicubic" %}
	{% set min_points = 4 %}
	{% else %}
	{% set algorithm = "lagrange" %}
	{% set min_points = 3 %}
	{% endif %}

	{% set points_x = [points_x , min_points]|max %}
	{% set points_y = [points_y , min_points]|max %}
	{% set points_x = [points_x , probe_count[0]]|min %}
	{% set points_y = [points_y , probe_count[1]]|min %}

	{% if verbose_enable == True %}
	{% if printer.exclude_object.objects != [] %}

	{ action_respond_info( "Algorithm: {}.".format(
	(algorithm),
	)) }

	{ action_respond_info("Default probe count: {},{}.".format(
	(probe_count[0]),
	(probe_count[1]),
	)) }

	{ action_respond_info("Adapted probe count: {},{}.".format(
	(points_x),
	(points_y),
	)) }

	{action_respond_info("Default mesh bounds: {}, {}.".format(
	(bed_mesh_min[0],bed_mesh_min[1]),
	(bed_mesh_max[0],bed_mesh_max[1]),
	)) }

	{% if mesh_margin > 0 %}
	{action_respond_info("Mesh margin is {}, mesh bounds extended by {}mm.".format(
	(mesh_margin),
	(mesh_margin),
	)) }
	{% else %}
	{action_respond_info("Mesh margin is 0, margin not increased.")}
	{% endif %}

	{% if fuzz_amount > 0 %}
	{action_respond_info("Mesh point fuzzing enabled, points fuzzed up to {}mm.".format(
	(fuzz_amount),
	)) }
	{% else %}
	{action_respond_info("Fuzz amount is 0, mesh points not fuzzed.")}
	{% endif %}

	{ action_respond_info("Adapted mesh bounds: {}, {}.".format(
	(adapted_x_min, adapted_y_min),
	(adapted_x_max, adapted_y_max),
	)) }

	{action_respond_info("KAMP adjustments successful. Happy KAMPing!")}

	{% else %}

	{action_respond_info("No objects detected! Check your gcode and make sure that EXCLUDE_OBJECT_DEFINE is happening before BED_MESH_CALIBRATE is called. Defaulting to regular meshing.")}
	G4 P5000
	{% endif %}

	{% endif %}

	{% if probe_dock_enable == True %}
	{attach_macro}
	{% endif %}

	_BED_MESH_CALIBRATE mesh_min={adapted_x_min},{adapted_y_min} mesh_max={adapted_x_max},{adapted_y_max} ALGORITHM={algorithm} PROBE_COUNT={points_x},{points_y}

	{% if probe_dock_enable == True %}
	{detach_macro}
	{% endif %}

