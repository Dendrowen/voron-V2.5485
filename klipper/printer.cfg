[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
# serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_150024000F50535556323420-if00
serial: /dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.4:1.0
restart_method: command
##--------------------------------------------------------------------

[mcu sb2040]
canbus_uuid: efb893a4a197

[include config/motion.cfg]
[include config/homing.cfg]
[include config/extruder.cfg]
[include config/fans.cfg]
[include config/misc.cfg]
[include config/leds.cfg]
[include config/display.cfg]
[include config/mainsail.cfg]
[include config/timelapse.cfg]

[include macros/*.cfg]

[exclude_object]

[respond]

[printer]
kinematics: corexy
max_velocity: 800  
max_accel: 5000             
max_z_velocity: 40          
max_z_accel: 350
square_corner_velocity: 5.0

[heater_bed]
##  Uncomment the following line if using the default SSR wiring from the docs site
heater_pin: PA3
##  Other wiring guides may use BED_OUT to control the SSR. Uncomment the following line for those cases
# heater_pin: PA1
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed. Rule of thumb is 0.4 watts / cm^2 .
max_power: 0.6
min_temp: 0
max_temp: 120
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769