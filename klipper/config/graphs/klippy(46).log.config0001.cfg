	SAVE_GCODE_STATE NAME=MMU_PRE_UNLOAD_state

	_MMU_AUTO_HOME
	_MMU_SAVE_POSITION
	{% if not park_after_form_tip %}
	_MMU_PARK
	{% endif %}

	{vars.user_pre_unload_extension|default("")}

	RESTORE_GCODE_STATE NAME=MMU_PRE_UNLOAD_state

[gcode_macro _MMU_POST_FORM_TIP]
