[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:

    {% set pos = printer.gcode_move.gcode_position %}
    {% set max = printer.toolhead.axis_maximum %}
    {% set z_max = max.z - 0.5%}
    {% set z_hop = [pos.z + 10, z_max]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    TURN_OFF_HEATERS
    
    G90        
    G1 Z{z_hop} E-1 F4000
    G1 Y{max.y} F24000
    _FILAMETRIX_GANTRY_SERVO_DOWN
    M107                 

    MMU_EJECT

    # CHAMBER_LEDS_OFF
    BED_MESH_CLEAR
    STATUS_COOLING
    TURN_ON_BED_COOLER
    # reset the electronics temperature
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=electronics TARGET={printer.configfile.settings['temperature_fan electronics'].target_temp}
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END

[delayed_gcode TURN_OFF_BED_COOLER]
gcode:
  {% if printer['heater_generic Chamber'].temperature < 60 %}
    SET_HEATER_TEMPERATURE HEATER=Chamber TARGET=0
  {% else %}
    SET_HEATER_TEMPERATURE HEATER=Chamber TARGET=75
    UPDATE_DELAYED_GCODE ID=TURN_OFF_BED_COOLER DURATION=5
  {% endif %}


[gcode_macro TURN_ON_BED_COOLER]
gcode:
  SET_HEATER_TEMPERATURE HEATER=Chamber TARGET=75
  UPDATE_DELAYED_GCODE ID=TURN_OFF_BED_COOLER DURATION=1