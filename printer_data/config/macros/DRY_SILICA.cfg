[gcode_macro DRY_SILICA]
# settings
variable_no_drop_max: 60    
variable_measure_every_x_seconds: 30

# Hands off
variable_force_g_start: 0
variable_force_g_previous: 0
variable_force_g_lowest: 0
variable_force_g_last: 0
variable_no_drop_measurements: 0
variable_no_drop_max_measured: 0
gcode:
    STOP_DRYER
    UPDATE_DELAYED_GCODE ID=TURN_OFF_BED_COOLER DURATION=0
    SET_HEATER_TEMPERATURE HEATER=Chamber TARGET=0
    
    RESPOND MSG="Heat up to 110c"
    M117 Drying silica
    M190 S110
    M400
    M140 S0
    G4 P1500
    M400
    _DRY_SILICA_RECORD_FORCE
    _DRY_SILICA_START

[delayed_gcode DRY_SILICA]
gcode:
    M140 S0
    G4 P1500
    M400
    _DRY_SILICA_RECORD_FORCE
    _DRY_SILICA_CHECK_WEIGHT
    

[gcode_macro _DRY_SILICA_RECORD_FORCE]
gcode:  
    {% set dry = printer['gcode_macro DRY_SILICA'] %}
    SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_previous VALUE={dry.force_g_last}
    {% set force = printer.load_cell.force_g %}
    # RESPOND MSG={"'Force: %.2fg'" % force}
    SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_last VALUE={force}

[gcode_macro _DRY_SILICA_CHECK_WEIGHT]
gcode:
    {% set dry = printer['gcode_macro DRY_SILICA'] %}
    M140 S110
    {% if dry.force_g_last < dry.force_g_lowest %}
        SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=no_drop_measurements VALUE=0
        SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_lowest VALUE={dry.force_g_last}
    {% elif dry.force_g_last > dry.force_g_start %}
        {% set diff = dry.force_g_last - dry.force_g_start %}
        SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_start VALUE={dry.force_g_last}
        SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_lowest VALUE={dry.force_g_lowest + diff}
    {% else %}
        SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=no_drop_measurements VALUE={dry.no_drop_measurements + 1}
        _DRY_SILICA_PRINT_PROGRESS
    {% endif %}
    {% if dry.no_drop_measurements < dry.no_drop_max %}
        UPDATE_DELAYED_GCODE ID=DRY_SILICA DURATION={dry.measure_every_x_seconds|int}
    {% else %}
        RESPOND MSG={"'Beads dry, dissipated %dg of moisture'" % (dry.force_g_start - dry.force_g_lowest)}
        M140 S0
    {% endif %}

[gcode_macro _DRY_SILICA_START]
gcode:
    {% set dry = printer['gcode_macro DRY_SILICA'] %}
    SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_start VALUE={dry.force_g_last}
    SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=force_g_lowest VALUE={dry.force_g_last}
    SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=no_drop_measurements VALUE=0
    SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=no_drop_max_measured VALUE=0
    M140 S110
    RESPOND MSG={"'Starting with %dg'" % dry.force_g_last}
    RESPOND MSG={"'[%s]'" % (' ' * dry.no_drop_max)}
    UPDATE_DELAYED_GCODE ID=DRY_SILICA DURATION={dry.measure_every_x_seconds|int}

[gcode_macro _DRY_SILICA_PRINT_PROGRESS]
gcode:
    {% set dry = printer['gcode_macro DRY_SILICA'] %}
    {% if dry.no_drop_max_measured < dry.no_drop_measurements %}
        SET_GCODE_VARIABLE MACRO=DRY_SILICA VARIABLE=no_drop_max_measured VALUE={dry.no_drop_measurements}
        RESPOND MSG={"'[%s%s]'" % ('=' * (dry.no_drop_measurements), ' ' * (dry.no_drop_max - dry.no_drop_max_measured))}
    {% endif %}