# electronics bay fan
[temperature_fan electronics]
sensor_type: temperature_host
pin: PD15
max_temp: 80
target_temp: 67
min_temp: 0
max_speed: 0.4
min_speed: 0.0
kick_start_time: 0.2
off_below: 0.1
control: pid
pid_Kp: 1.0
pid_Ki: 5.0
pid_Kd: 0.5
pid_deriv_time: 20.0

[output_pin nevermore]
pin: PD14
pwm: True
value: 0
shutdown_value: 0

