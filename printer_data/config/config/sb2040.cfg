[board_pins th]
mcu: sb2040 # Assuming using an external / extra mcu dedicated to MMU
aliases:
    ADXL_SCLK=gpio0,
    ADXL_CS=gpio1,
    ADXL_MISO=gpio2,
    ADXL_MOSI=gpio3,
    # GPIO 4 and 5 are the CANBUS connection
    HEAT=gpio6,
    EXTR_ENABLE=gpio7,
    EXTR_UART=gpio8,
    EXTR_STEP=gpio9,
    EXTR_DIR=gpio10,
    # GPIO 11 not exposed
    RGB=gpio12,
    FAN0=gpio13,
    FAN1=gpio14,
    FAN2=gpio15,
    PWM0=gpio16,
    PWM1=gpio17,
    MAX_SCK=gpio18,
    MAX_MOSI=gpio19,
    ADXL_INT1=gpio20,
    ADXL_INT2=gpio21,
    MAX_CS=gpio22,
    MAX_MISO=gpio23,
    # GPIO 24 not exposed
    HV_ENDSTOP=gpio25,
    # GPIO 26 onboard temp
    TEMP=gpio27,
    ENDSTOP_1=gpio28,
    ENDSTOP_2=gpio29,