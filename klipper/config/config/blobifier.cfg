#######################################################################################################################################

# edwardyeeks#6042
# Sample macro config to be used in conjunction with the Decontaminator Purge Bucket & Nozzle Scrubber mod. Created by Hernsl 
# (hernsl#8860 on Discord) and edited by Edwardyeeks (edwardyeeks#6042 on Discord). Several ideas that made it as features by
# Deutherius (deutherius#3295 on Discord).

# The goal of this macro is to provide a nozzle scrubbing and purging routine that is easily copied/referenced into your  printer.cfg.
# Users can simply change parameters and enable/disable options in the first half. Descriptions are plentiful, making this macro
# look huge but informative and are laid out in sequence to be read first describing the line below; PLEASE READ CAREFULLY.

# This sample config assumes the following: The user has implemented the default decontaminator purge bucket & nozzle scrubber mod
# for the VORON 1/2. It can be tweaked to customised purge bucket geometries and brushes.

# Features in this macro: option of putting the bucket at the rear or front of the bed. Purge routine that can be enabled/disabled.
# By default, bucket is located at rear left of bed and purge routine is enabled. The purge and scrubbing routine is randomized
# in either left or right bucket to ensure as even as possible distribution of filament gunk.

# Default parameters are set for safe speeds and movements. Where necessary, tweak the parameters for the nozzle scrub procedure 
# to fit your printer.

# To avoid adding length of lines to your main printer.cfg config file, one can upload a config file separately into klipper and
# include it into the main printer config. Upload nozzle_scrub.cfg to the same directory as printer.cfg. Usually, it is in /home/pi/.
# Users of Fluidd, Mainsail and other klipper front ends would find it under /home/pi/klipper_config/.

# Once uploaded, add the following to your printer.cfg in the Macros section: [include /home/pi/nozzle_scrub.cfg] 
# Those running Fluidd, Mainsail and other front ends will need to use the following location instead:
# [include /home/pi/klipper_config/nozzle_scrub.cfg]

#######################################################################################################################################

# Name of the macro is clean_nozzle.

[gcode_macro CLEAN_NOZZLE]


# These parameters define your filament purging. The retract variable is used to retract right after purging to prevent unnecessary
# oozing. Some filament are particularly oozy and may continue to ooze out of the nozzle for a second or two after retracting. The
# ooze dwell variable makes allowance for this. Update as necessary. If you decided to not enable purge, you can ignore this section.
variable_purge_spd:           480	         ; Speed, in mm/min, of the purge.
variable_purge_temp_min:      200	         ; Minimum nozzle temperature to permit a purge. Otherwise, purge will not occur.
variable_purge_ret:             0.8          ; Retract length, in mm, after purging to prevent slight oozing. Adjust as necessary.

# Adjust this so that your nozzle scrubs within the brush. Currently defaulted to be a lot higher for safety. Be careful not to go too low!
variable_brush_top:             2.5 

# These parameters define your scrubbing, travel speeds, safe z clearance and how many times you want to wipe. Update as necessary. Wipe 
# direction is randomized based off whether the left or right bucket is randomly selected in the purge & scrubbing routine.
variable_clearance_z:           5	         ; When traveling, but not cleaning, the clearance along the z-axis between nozzle and brush.
variable_wipe_qty:              4	         ; Number of complete (A complete wipe: left, right, left OR right, left, right) wipes.
variable_travel_spd_xy:     30000	         ; Travel (not cleaning) speed along x and y-axis in mm/min.
variable_travel_spd_z:       2400	         ; Travel (not cleaning) speed along z axis in mm/min.
variable_wipe_spd_xy:        5000	         ; Nozzle wipe speed in mm/min.


# These parameters define the size of the brush. Update as necessary. A visual reference is provided below. Note that orientation of 
# parameters remain the same whether bucket is at rear or front.
# 
#                  ←   brush_width   →                            
#                   _________________                                                          ↑
#                  |                 |  ↑                     If you chose location_bucket_rear = True, Y position is acquired
#  brush_start (x) |                 | brush_depth            from your stepper_y position_max. Adjust your brush physically in
#                  |_________________|  ↓                               Y so that the nozzle scrubs within the brush.       
#                          (y)                                                                 ↓
#                      brush_front
# __________________________________________________________
#                     PRINTER FRONT
# 
# 
## For V1.8, you may need to measure where your brush is on the x axis and input manually into any of the variable_brush_start uncommented.
## For V2.4 250mm build, uncomment this below: 
#variable_brush_start:          25	    

## For V2.4 300mm build, uncomment this below:
variable_brush_start:          58

## For V2.4 350mm build, uncomment this below:
#variable_brush_start:          75

# width of the brush
variable_brush_width:          35	

variable_purge_x: 10
variable_purge_z: -0.4
variable_purge_start_z: 1
variable_max_iteration_length: 50
variable_iteration_z_raise: 6
variable_iteration_z_change: 1.2
variable_max_iterations_per_blob: 3
variable_eject_hop: 2

gcode:
  # home if not already homed
  _CG28
  # retrieve purge length from call
  {% set purge_len = params.PURGE_LEN|default(0)|float %}
  {% set purge_ret = params.RETRACT_AMOUNT|default(purge_ret)|float %}
  # Save the gcode state in this macro instance.
  SAVE_GCODE_STATE NAME=clean_nozzle

  # Set to absolute positioning.
  G90
  
  ## Grab max position of Y-axis from config to use in setting a fixed y position for location_bucket_rear = True.
  {% set position_y = printer.configfile.config["stepper_y"]["position_max"]|float %}

  # Check for purge length and purge if necessary.
  {% if purge_len > 0 %}
      
    _CG28
    _CQGL
  
    G1 X{brush_start} Y{position_y} F{travel_spd_xy}
    G1 X{purge_x}
    G1 Z{purge_z + purge_start_z} F{travel_spd_z}
  
    BLOBIFIER_SERVO POS=out
  
    {% if printer.extruder.temperature < purge_temp_min %}
      M109 S{purge_temp_min}
    {% endif %}
  
    {% set iterations = (purge_len|float / max_iteration_length)|round(0, 'ceil')|int %}
  
    {% for n in range(iterations) %}
      {% set step = n % max_iterations_per_blob %}
      {% set extrude_amount = [purge_len - (max_iteration_length * n),max_iteration_length]|min %}
      
      
      G91 # relative positioning
      M83
    
      {% if step == 0 %}
        {% set raise_z = (iteration_z_raise - purge_start_z) * ((extrude_amount|float) / max_iteration_length) %}
      {% else %}  
        {% set raise_z = (iteration_z_raise - step * iteration_z_change) * ((extrude_amount|float) / max_iteration_length) %}
      {% endif %}
      
      {% set duration = (extrude_amount|float) / purge_spd %} #how many minutes should the extrusion take (usualy 0.1 minutes / 6 seconds with default parameters)
      {% set speed = raise_z / duration %}
    
    
      G1 Z{raise_z} E{extrude_amount} F{speed}
    
      {% if step == (max_iterations_per_blob - 1) or (purge_len - (max_iteration_length * (n+1))) <= 0 %}
  
        G1 Z{eject_hop} F{travel_spd_z}
        BLOBIFIER_SERVO POS=in
        G90 # absolute positioning
        G1 Z{purge_z + purge_start_z}
        BLOBIFIER_SERVO POS=out
      {% endif %}
    {% endfor %}
    G1 E-{purge_ret}
  {% endif %}
  
  # Position for wipe. Either left or right of brush based off bucket_pos to avoid unnecessary travel.
  G1 Z{brush_top + clearance_z} F{travel_spd_z}
  G1 X{brush_start} F{travel_spd_xy}
  G1 Y{position_y}

  # Move nozzle down into brush.
  G1 Z{brush_top} F{travel_spd_z}
   
  # Perform wipe. Wipe direction based off bucket_pos for cool random scrubby routine.
  {% for wipes in range(1, (wipe_qty + 1)) %}
     G1 X{brush_start + brush_width} F{wipe_spd_xy}
     G1 X{brush_start} F{wipe_spd_xy}
  {% endfor %}
   
  # Clear from area.
  G1 Z{brush_top + clearance_z} F{travel_spd_z}

  ## Restore the gcode state to how it was before the macro.
  RESTORE_GCODE_STATE NAME=clean_nozzle


[gcode_macro BLOBIFIER_SERVO]
variable_dwell_time: 300
gcode:
  {% set pos = params.POS %}
  {% if pos == "in" %}
    SET_SERVO SERVO=blobifier ANGLE=180
    G4 P{dwell_time}
  {% elif pos == "out" %}
    SET_SERVO SERVO=blobifier ANGLE=0
    G4 P{dwell_time}
  {% else %}
    {action_respond_info("provide POS=[in|out]")}
  {% endif %}
  SET_SERVO SERVO=blobifier WIDTH=0

[servo blobifier]
pin: PB0
maximum_servo_angle: 180
minimum_pulse_width: 0.00053
maximum_pulse_width: 0.0023
initial_angle: 0