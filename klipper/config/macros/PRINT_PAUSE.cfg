[gcode_macro SLEEP]
variable_extruder_temp: 0
gcode:
    _MMU_SAVE_POSITION
    SET_IDLE_TIMEOUT TIMEOUT=84600
    UPDATE_DELAYED_GCODE ID=PAUSE_SLEEPMODE DURATION=300
    SAVE_GCODE_VARIABLE MACRO=SLEEP VARIABLE=extruder_temp VALUE={printer.extruder.target}

[delayed_gcode PAUSE_SLEEPMODE]
gcode:
    M107
    M104 S0
    {% set pos = printer.gcode_move.gcode_position %} 
    {% set max_pos = printer.toolhead.axis_maximum %}
    {% set min_height = 150 %}
    {% set z = [min_height, pos.z]|max %}
    G1 Z{z} F1000
    CHAMBER_LEDS_OFF
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=electronics TARGET=65


    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=electronics TARGET=55
    SET_LED LED="chamber_leds" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1
    SET_IDLE_TIMEOUT TIMEOUT=300

[delayed_gcode WAKE]
gcode:
    M109 S{printer['gcode_macro SLEEP'].extruder_temp}
    BLOBIFIER
    _MMU_RESTORE_POSITION